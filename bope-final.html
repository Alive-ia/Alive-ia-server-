<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOPE IA - Kinshasa</title><style>body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui;text-align:center;padding:18px}.logo{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#007FFF,#FFD700,#CE1020);display:flex;align-items:center;justify-content:center;margin:18px auto;font-size:38px;font-weight:900;box-shadow:0 0 20px #007FFF55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:500px;margin:20px auto}.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:18px;cursor:pointer}.card:hover{border-color:#007FFF}input{width:92%;max-width:500px;padding:15px;border-radius:30px;border:0;background:#1a1a1a;color:#fff;margin:20px 0}#chat{max-width:500px;margin:0 auto;text-align:left}.msg{background:#1e1e1e;padding:10px;border-radius:10px;margin:8px 0}</style></head><body><div class="logo">B</div><h2>BOPE IA 🇨🇩</h2><p>IA Générale Kinshasa - Video • Apprendre • Emploi • Sante • Admin RDC</p><div class="grid"><div class="card" onclick="ask('Creer une video')">🎬<br>Create video</div><div class="card" onclick="ask('Je veux apprendre')">📚<br>Apprendre</div><div class="card" onclick="ask('Cherche emploi')">💼<br>Emploi</div><div class="card" onclick="ask('Conseil sante')">🏥<br>Sante</div><div class="card" onclick="ask('Aide Admin RDC')">📄<br>Admin RDC</div><div class="card" onclick="ask('Question generale')">🌍<br>General</div></div><input id="q" placeholder="Parle à BOPE..." onkeydown="if(event.key==='Enter')send()"><div id="chat"></div><script>function ask(t){document.getElementById('q').value=t;send()}async function send(){let i=document.getElementById('q'),m=i.value;if(!m)return;let c=document.getElementById('chat');c.innerHTML+=`<div class=msg><b>Vous:</b> ${m}</div>`;i.value='';let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});let d=await r.json();c.innerHTML+=`<div class=msg><b>BOPE:</b> ${d.reply}</div>`}</script></body></html>
