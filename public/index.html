<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOPE IA</title>

<!-- Google Analytics BOPE -->

<script>
window.dataLayer=window.dataLayer||[];
function gtag(){dataLayer.push(arguments);}
gtag('js',new Date());
gtag('config','G-BOPE123');

<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{margin:0}
#chat{width:92%;max-width:440px;flex:1;overflow-y:auto;margin:12px 0 180px;padding:14px;display:flex;flex-direction:column;gap:14px}
.msg{padding:12px 16px;border-radius:18px;white-space:pre-wrap;font-size:15px;line-height:1.7}
.user{background:#2f4f8a;align-self:flex-end}
.bot{background:#151515;border:1px solid #222;align-self:flex-start}
.share-btn{margin-top:8px;background:#222;border:1px solid #333;color:#25D366;padding:4px 10px;border-radius:20px;font-size:11px;cursor:pointer}
.box{position:fixed;bottom:0;left:0;right:0;background:#000;padding:10px;display:flex;flex-direction:column;align-items:center;border-top:1px solid #1a1a1a}
.in{width:92%;max-width:440px;background:#1e1e1e;border-radius:28px;display:flex;align-items:center;padding:8px 14px}
.in input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:16px}
.in button{background:#3a5fd0;border:none;color:#fff;width:36px;height:36px;border-radius:50%}
.modes{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;justify-content:center}
.modes button{background:#222;color:#888;border:1px solid #333;padding:6px 11px;border-radius:20px;font-size:11px}
.modes button.active{background:#3a5fd0;color:#fff;border-color:#3a5fd0}
.sante-box{display:none;width:92%;max-width:440px;background:#151515;border:1px solid #333;border-radius:12px;padding:10px;margin-bottom:8px;gap:6px;flex-wrap:wrap}
.sante-box.show{display:flex}
.sante-box input{background:#222;border:1px solid #333;color:#fff;border-radius:8px;padding:6px 8px;width:30%;font-size:12px}
.sante-box input.wide{width:62%}
#welcome{width:92%;max-width:440px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 0 0}
.quick{width:100%;background:#121212;border:1px solid #2a2a2a;color:#e0e0e0;padding:14px;border-radius:14px;font-size:13.5px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;margin-bottom:10px}
.quick:hover{background:#1c1c1c;border-color:#3a5fd0}
.logo-top{width:44px;height:44px;border-radius:50%;border:2px solid #3a5fd0}
.logo-center{width:96px;height:96px;border-radius:50%;border:3px solid #3a5fd0}
</style>
</head>
<body>

<div style="display:flex;align-items:center;gap:12px;margin:18px 0 2px">
<svg class="logo-top" viewBox="0 0 100 100" style="background:#0a0a0a"><circle cx="50" cy="50" r="46" fill="none" stroke="#0085CA" stroke-width="7" stroke-dasharray="95 190"/><circle cx="50" cy="50" r="46" fill="none" stroke="#FFD100" stroke-width="7" stroke-dasharray="47 237" stroke-dashoffset="-95"/><circle cx="50" cy="50" r="46" fill="none" stroke="#EF3340" stroke-width="7" stroke-dasharray="47 237" stroke-dashoffset="-142"/></svg>
<h1>BOPE IA</h1>
</div>

<div style="color:#888;font-size:13px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:6px">
<span>par alive bope • IA Congolaise</span>
<img src="https://hits.sh/alive-ia-server.onrender.com.svg?label=Visites&color=3a5fd0&labelColor=222" />
<button onclick="partagerBOPE()" style="background:#25D366;color:#fff;border:none;padding:5px 12px;border-radius:20px;font-size:11px;cursor:pointer">↗️ Partager</button>
</div>

<div id="welcome">
<svg class="logo-center" viewBox="0 0 100 100" style="background:#0a0a0a"><circle cx="50" cy="50" r="46" fill="none" stroke="#0085CA" stroke-width="7" stroke-dasharray="95 190"/><circle cx="50" cy="50" r="46" fill="none" stroke="#FFD100" stroke-width="7" stroke-dasharray="47 237" stroke-dashoffset="-95"/><circle cx="50" cy="50" r="46" fill="none" stroke="#EF3340" stroke-width="7" stroke-dasharray="47 237" stroke-dashoffset="-142"/><text x="50" y="55" text-anchor="middle" fill="white" font-size="20" font-weight="bold">BOPE</text></svg>
<h2 style="margin:14px 0 6px">Que veux-tu faire?</h2>
<button class="quick" onclick="quickAsk('Je m\'appelle')">👋 Je m'appelle...</button>
<button class="quick" onclick="quickAsk('Explique-moi la fièvre typhoïde')">🩺 Expliquer une maladie</button>
<button class="quick" onclick="quickAsk('Analyse match Barça vs Real pronostic sûr')">⚽ Analyser un match</button>
<button class="quick" onclick="quickAsk('Actualités RDC aujourd\'hui')">📰 Actualités RDC</button>
</div>

<div id="chat"></div>

<div class="box">
<div class="modes">
<button id="mCourt" class="active" onclick="setMode('court')">Court</button>
<button id="mDetail" onclick="setMode('detail')">Détaillé</button>
<button id="mPari" onclick="setMode('pari')">⚽ Pari</button>
<button id="mSante" onclick="setMode('sante')">🩺 Santé</button>
</div>
<div id="santeBox" class="sante-box">
<input id="temp" placeholder="Temp °C ex 38.5">
<input id="tension" placeholder="Tension ex 14/9">
<input id="pouls" placeholder="Pouls ex 90">
<input id="poids" placeholder="Poids kg ex 65" class="wide">
<input id="sympt" placeholder="Symptômes ex brûlure urine" class="wide" style="width:100%">
<button onclick="fillSante()" style="background:#3a5fd0;color:#fff;border:none;padding:6px 12px;border-radius:8px;width:100%">Ajouter au message</button>
</div>
<div class="in">
<input id="input" placeholder="Demande à BOPE,">
<button onclick="send()">▲</button>
</div>
<div style="font-size:10px;color:#555;margin-top:6px;text-align:center">⚠️ BOPE Santé 85% = orientation étudiant UNIKIK, pas médecin. • bopealive@gmail.com</div>
</div>

<script>
let MODE='court';
function setMode(m){MODE=m;document.querySelectorAll('.modes button').forEach(b=>b.classList.remove('active'));const map={court:'mCourt',detail:'mDetail',pari:'mPari',sante:'mSante'};document.getElementById(map[m]).classList.add('active');document.getElementById('santeBox').classList.toggle('show',m==='sante');}
function fillSante(){let t=document.getElementById('temp').value,ten=document.getElementById('tension').value,p=document.getElementById('pouls').value,po=document.getElementById('poids').value,s=document.getElementById('sympt').value;let msg="";if(t)msg+="Temp "+t+"°C ";if(ten)msg+="Tension "+ten+" ";if(p)msg+="Pouls "+p+" ";if(po)msg+="Poids "+po+"kg ";if(s)msg+="Symptômes: "+s;document.getElementById('input').value=msg;}
function quickAsk(txt){document.getElementById('input').value=txt;send();}
async function partagerBOPE(){const url=window.location.href;const txt="Découvre BOPE IA par Alive Bope: ";if(navigator.share){try{await navigator.share({title:'BOPE IA',text:txt,url:url});}catch(e){}}else{await navigator.clipboard.writeText(txt+url);alert("Lien copié!");}}
async function partagerRep(id){const el=document.getElementById(id);let txt=el.innerText.replace('↗️ Partager cette réponse','').trim();if(navigator.share){try{await navigator.share({title:'BOPE IA',text:txt});}catch(e){}}else{await navigator.clipboard.writeText(txt);alert("Copié!");}}
async function send(){const i=document.getElementById('input'),c=document.getElementById('chat');if(!i.value.trim())return;const t=i.value;i.value='';const wel=document.getElementById('welcome');if(wel)wel.style.display='none';c.innerHTML+='<div class="msg user">'+t+'</div>';c.innerHTML+='<div class="msg bot" id="ld">Analyse en cours...</div>';c.scrollTop=c.scrollHeight;try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,mode:MODE})});const d=await r.json();document.getElementById('ld').remove();const id=Date.now();c.innerHTML+='<div class="msg bot" id="bot'+id+'">'+d.reply+'<br><button class="share-btn" onclick="partagerRep(\'bot'+id+'\')">↗️ Partager cette réponse</button></div>';}catch(e){document.getElementById('ld').remove();c.innerHTML+='<div class="msg bot">erreur '+e.message+'</div>';}c.scrollTop=c.scrollHeight}
document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')send()})
</script>
</body>
