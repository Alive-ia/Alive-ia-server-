async function partagerBOPE(){const url=window.location.href;const txt="Decouvre BOPE IA cree par Alive Bope UNIKIK: ";gtag('event','partage_bope');if(navigator.share){try{await navigator.share({title:'BOPE IA',text:txt,url:url});}catch(e){}}else{await navigator.clipboard.writeText(txt+url);alert("Lien BOPE copie!");}}
async function partagerRep(id){const el=document.getElementById(id);let txt=el.innerText.replace(/Partager cette reponse/,'').trim();gtag('event','partage_reponse');if(navigator.share){try{await navigator.share({title:'BOPE IA',text:txt});}catch(e){}}else{await navigator.clipboard.writeText(txt);alert("Reponse copiee!");}}
